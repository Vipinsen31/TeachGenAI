
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeachGenAI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: #eef4ff;
      border-radius: 12px;
      display: none;
      line-height: 1.6;
    }

    .scene {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-left: 4px solid #2563eb;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 TeachGenAI</h1>
  <p>Intelligent System for Automated Educational Video Generation</p>
</header>

<div class="container">
  <div class="card">
    <h2>Generate Educational Content</h2>

    <input id="topic" type="text" placeholder="Enter a topic, e.g. Photosynthesis">

    <select id="language">
      <option value="English">English</option>
      <option value="Hindi">Hindi</option>
    </select>

    <button onclick="generateLesson()">Generate Educational Lesson</button>

    <div id="result"></div>
  </div>
</div>

<script>
function generateLesson() {
  const topic = document.getElementById("topic").value.trim();
  const language = document.getElementById("language").value;
  const result = document.getElementById("result");

  if (!topic) {
    alert("Please enter a topic.");
    return;
  }

  let title;
  let intro;

  if (language === "Hindi") {
    title = topic + " — शैक्षिक पाठ";
    intro = topic + " को सरल भाषा में समझें। यह TeachGenAI का AI-powered educational lesson है।";
  } else {
    title = topic + " — Educational Lesson";
    intro = "Learn " + topic + " in a simple and easy-to-understand way with TeachGenAI.";
  }

  result.style.display = "block";

  result.innerHTML = `
    <h2>${title}</h2>
    <p>${intro}</p>

    <h3>Learning Objectives</h3>
    <ul>
      <li>Understand the basic concept of ${topic}</li>
      <li>Learn important points and applications</li>
      <li>Review the topic through a structured lesson</li>
    </ul>

    <h3>🎬 Educational Video Storyboard</h3>

    <div class="scene">
      <b>Scene 1 — Introduction</b>
      <p>Introduction to ${topic}.</p>
    </div>

    <div class="scene">
      <b>Scene 2 — Main Concept</b>
      <p>Explanation of the key concepts of ${topic}.</p>
    </div>

    <div class="scene">
      <b>Scene 3 — Example</b>
      <p>A simple example to understand ${topic}.</p>
    </div>

    <div class="scene">
      <b>Scene 4 — Summary</b>
      <p>Important points of ${topic} are summarized here.</p>
    </div>
  `;
}
</script>

</body>
</html>
