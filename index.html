<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeachGenAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #1d4ed8;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 12px;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #475569;
    }

    button.success {
      background: #16a34a;
    }

    .hidden {
      display: none;
    }

    .teacher-preview {
      text-align: center;
      margin-top: 15px;
    }

    .teacher-preview img {
      max-width: 220px;
      max-height: 250px;
      border-radius: 15px;
      object-fit: cover;
      border: 3px solid #2563eb;
    }

    .scene {
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      padding: 15px;
      margin: 12px 0;
      background: #f8fafc;
    }

    .scene h3 {
      margin-top: 0;
      color: #2563eb;
    }

    .video-box {
      background: #111827;
      color: white;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .video-teacher {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      margin: 10px auto;
    }

    .video-text {
      font-size: 20px;
      line-height: 1.5;
      min-height: 80px;
      margin: 15px 0;
    }
